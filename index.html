<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#C1653A">
<title>Migaja — Recetario Sin Gluten</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>Migaja</h1>
      <p class="tagline">Recetario sin gluten</p>
    </div>
  </div>
  <div id="backupIndicator" class="backup-indicator" title="Estado del respaldo"></div>
</header>

<nav class="tabbar" id="tabbar">
  <button class="tab-btn" data-tab="hoy">Hoy</button>
  <button class="tab-btn" data-tab="ingredientes">Ingredientes</button>
  <button class="tab-btn" data-tab="recetas">Recetas</button>
  <button class="tab-btn" data-tab="pruebas">Pruebas</button>
  <button class="tab-btn" data-tab="pan">Pan</button>
  <button class="tab-btn" data-tab="respaldo">Respaldo</button>
</nav>

<main id="app">
  <section id="view-hoy" class="view"></section>
  <section id="view-ingredientes" class="view"></section>
  <section id="view-recetas" class="view"></section>
  <section id="view-pruebas" class="view"></section>
  <section id="view-pan" class="view"></section>
  <section id="view-respaldo" class="view"></section>
</main>

<div id="overlay" class="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<div id="toast" class="toast"></div>

<script src="js/db.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/backup.js"></script>
<script src="js/ingredients.js"></script>
<script src="js/recipes.js"></script>
<script src="js/tryouts.js"></script>
<script src="js/bread.js"></script>
<script src="js/app.js"></script>
</body>
</html>
